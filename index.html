<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Tipping</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#1c1c1e;--mute:#6b6b70;--line:#e3e1db;--acc:#e8590c;--ok:#2b8a3e;--bad:#c92a2a;--chip:#efede7}
@media (prefers-color-scheme:dark){:root{--bg:#101012;--card:#1b1b1f;--ink:#f1f1f3;--mute:#9a9aa2;--line:#2f2f36;--acc:#ff8a4c;--ok:#69db7c;--bad:#ff8787;--chip:#26262c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
h1{font-size:21px;margin:0}
.who{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.link{background:none;border:0;color:var(--acc);font-size:13px;padding:4px}
.tabs,.nav{display:flex;gap:6px;margin-bottom:12px}
.tabs button,.nav button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.nav .d{flex:3;display:flex;align-items:center;justify-content:center;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.meta{font-size:12px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.live{color:var(--bad);font-weight:700}
.row{display:flex;gap:6px;align-items:stretch}
.at{align-self:center;color:var(--mute);font-size:12px}
.pick{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px 10px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px}
.pick img{width:52px;height:52px;object-fit:contain;margin-bottom:4px}
.pick b{font-size:16px}
.pick small{color:var(--mute);font-size:11px}
.pick i{font-style:normal;font-size:20px;font-weight:700;margin-top:2px}
.pick.sel{border-color:var(--tc);background:var(--chip);background:color-mix(in srgb,var(--tc) 14%,var(--card))}
.pick.win{box-shadow:0 0 0 2px var(--ok)}
.pick.lose{opacity:.55}
.pick:disabled{opacity:.85}.pick.lose:disabled{opacity:.5}
.tick{position:absolute;top:6px;right:8px;font-size:13px;font-weight:700;color:var(--tc)}
.chips{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
.chip{background:var(--chip);border-radius:20px;padding:2px 9px}
.chip.r{color:var(--ok)}.chip.w{color:var(--bad)}
.lb{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}.lb .n{flex:1}.lb b{font-size:19px}.lb.me{background:var(--chip);border-radius:10px}
.rk{width:26px;text-align:center;color:var(--mute)}
input{font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.btn{padding:11px 14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;width:100%;font-size:15px}
.note{color:var(--mute);font-size:13px;text-align:center;padding:20px 8px}
.warn{background:var(--chip);border-radius:12px;padding:10px;font-size:13px;margin-bottom:10px}
.login{max-width:340px;margin:60px auto 0;text-align:center;padding:22px}
.login .logo{font-size:44px}.login h2{margin:6px 0 2px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:6px 0}
</style>
</head>
<body>
<main>
<div class="bar"><h1>🏀 NBA Tipping</h1><div class="who" id="who"></div></div>
<div id="top"></div>
<div class="tabs" id="tabs"><button id="t1" class="on">Games</button><button id="t2">Leaderboard</button></div>
<div id="app"><div class="note">Loading…</div></div>
</main>
<script>
/* ===== SETUP ===== */
var DB_URL = "https://tripping-dd4e6-default-rtdb.firebaseio.com";
var API_KEY = "575241614071"; /* Firebase Web API key. Leave empty = no login page (name only). */
/* ================= */

var BASE="https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard";
var SEASON_START=Date.UTC(2026,9,19);
var AUTH=!!API_KEY,S=null,tok="",uid="",mode="in",lerr="",started=false;
try{S=JSON.parse(localStorage.getItem("nba_sess")||"null")}catch(e){}
var me=AUTH?"":(localStorage.getItem("nba_name")||"");
var games=[],picks={},names={},tab=1,err="",dcache={},map={};
var day=startOfDay(Date.now());
var app=document.getElementById("app"),top_=document.getElementById("top");

function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function clean(n){return n.replace(/[.$#\[\]\/]/g,"_").trim().slice(0,24)}
function locked(g){return Date.now()>=g.tip}
function winner(g){return g.fin?(g.hs>g.as?"home":"away"):null}
function fmtT(t){return new Date(t).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}
function lum(h){var n=parseInt(h,16);return((n>>16&255)*299+(n>>8&255)*587+(n&255)*114)/1000}
function tc(c,alt){var o=[c,alt].filter(function(x){return /^[0-9a-fA-F]{6}$/.test(x||"")&&lum(x)>=45&&lum(x)<=225})[0];return"#"+(o||"8a8a93")}

/* ---------- auth ---------- */
async function post(url,body,form){
  var r=await fetch(url,{method:"POST",headers:{"Content-Type":form?"application/x-www-form-urlencoded":"application/json"},body:body});
  var j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||"error");return j;
}
function setSess(j,name){
  tok=j.idToken||j.id_token;uid=j.localId||j.user_id;
  S={rt:j.refreshToken||j.refresh_token,name:name||(S&&S.name)||""};me=S.name;
  localStorage.setItem("nba_sess",JSON.stringify(S));
}
async function refresh(){
  if(!S)return false;
  try{setSess(await post("https://securetoken.googleapis.com/v1/token?key="+API_KEY,"grant_type=refresh_token&refresh_token="+encodeURIComponent(S.rt),true));return true}
  catch(e){S=null;tok="";localStorage.removeItem("nba_sess");return false}
}
async function signIn(u,p,create){
  var j=await post("https://identitytoolkit.googleapis.com/v1/accounts:"+(create?"signUp":"signInWithPassword")+"?key="+API_KEY,
    JSON.stringify({email:u.toLowerCase()+"@nbatipping.app",password:p,returnSecureToken:true}));
  setSess(j,u);
  if(create)await put("names/"+uid,u);
}
function niceErr(m){
  if(/EMAIL_EXISTS/.test(m))return"That username is taken.";
  if(/INVALID_LOGIN|EMAIL_NOT_FOUND|INVALID_PASSWORD/.test(m))return"Wrong username or password.";
  if(/OPERATION_NOT_ALLOWED/.test(m))return"Email/Password sign-in isn’t switched on in Firebase yet.";
  if(/WEAK_PASSWORD/.test(m))return"Password needs 6+ characters.";
  if(/TOO_MANY/.test(m))return"Too many tries — wait a minute.";
  return"Couldn’t sign in: "+m;
}
async function doLogin(){
  var u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){lerr="Username: 3–20 letters, numbers or _";return render()}
  if(p.length<6){lerr="Password needs 6+ characters.";return render()}
  try{await signIn(u,p,mode==="up");lerr="";await start()}catch(e){lerr=niceErr(e.message);render()}
}

/* ---------- data ---------- */
function q(p){return DB_URL+"/"+p+".json"+(tok?"?auth="+tok:"")}
async function put(path,val){
  var o={method:"PUT",body:JSON.stringify(val)},r=await fetch(q(path),o);
  if(r.status===401&&AUTH&&await refresh())r=await fetch(q(path),o);
  if(!r.ok)throw 0;
}
async function getDay(k){
  var c=dcache[k];if(c&&(Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8))<Date.now()-3*864e5||Date.now()-c<50000))return;
  var r=await fetch(BASE+"?limit=100&dates="+k),j=await r.json();
  (j.events||[]).forEach(function(ev){try{
    var c0=ev.competitions[0],H,A,st=ev.status&&ev.status.type||{};
    c0.competitors.forEach(function(x){if(x.homeAway==="home")H=x;else A=x});
    map[ev.id]={id:ev.id,tip:Date.parse(ev.date),a:A.team.abbreviation,an:A.team.shortDisplayName,h:H.team.abbreviation,hn:H.team.shortDisplayName,
      al:A.team.logo,hl:H.team.logo,ac:tc(A.team.color,A.team.alternateColor),hc:tc(H.team.color,H.team.alternateColor),
      fin:!!st.completed,live:st.state==="in",as:+A.score||0,hs:+H.score||0};
  }catch(e){}});
  dcache[k]=Date.now();
}
function ymd(t){var d=new Date(t);return d.getUTCFullYear()+("0"+(d.getUTCMonth()+1)).slice(-2)+("0"+d.getUTCDate()).slice(-2)}
async function ensure(from,to){
  var ks=[],fails=0;
  for(var t=from-864e5;t<=to+864e5;t+=864e5){var k=ymd(t);if(ks.indexOf(k)<0)ks.push(k)}
  for(var i=0;i<ks.length;i+=6)await Promise.all(ks.slice(i,i+6).map(function(k){return getDay(k).catch(function(){fails++})}));
  err=(fails&&!Object.keys(map).length)?"Couldn’t load the schedule feed. Try refreshing in a minute.":"";
  games=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return a.tip-b.tip});
}
async function loadSched(){if(tab===2)await ensure(SEASON_START,Date.now()+2*864e5);else await ensure(day,day+864e5)}
async function loadPicks(){
  try{
    var raw=(await(await fetch(q("picks"))).json())||{};
    if(raw.error)throw 0;
    if(AUTH){
      names=(await(await fetch(q("names"))).json())||{};picks={};
      Object.keys(raw).forEach(function(k){picks[names[k]||"Someone"]=raw[k]});
      if(uid&&names[uid])me=names[uid];
    }else picks=raw;
  }catch(e){}
}
async function savePick(gid,side){
  if(!picks[me])picks[me]={};picks[me][gid]=side;render();
  try{await put("picks/"+(AUTH?uid:encodeURIComponent(me))+"/"+gid,side)}
  catch(e){err="Couldn’t save that tip — check your connection.";render()}
}

/* ---------- views ---------- */
function sideBtn(g,s,w,m,lk){
  var A=s==="away",ab=A?g.a:g.h,n=A?g.an:g.hn,lg=A?g.al:g.hl,c=A?g.ac:g.hc,sc=A?g.as:g.hs;
  var cls="pick"+(m===s?" sel":"")+(w===s?" win":"")+(w&&w!==s?" lose":"");
  return '<button class="'+cls+'" style="--tc:'+c+'" data-g="'+g.id+'" data-s="'+s+'"'+((lk||!me)?" disabled":"")+'>'+
    (lg?'<img src="'+esc(lg)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'<b>'+esc(ab)+'</b><small>'+esc(n)+'</small>'+
    (g.fin||g.live?'<i>'+sc+'</i>':'')+(m===s?'<span class="tick">✓</span>':'')+'</button>';
}
function card(g){
  var lk=locked(g),w=winner(g),m=(picks[me]||{})[g.id];
  var who=Object.keys(picks).filter(function(u){return picks[u][g.id]});
  var st=g.fin?"Final":g.live?'<span class="live">● LIVE</span>':(lk?"Locked":who.length+" tipped");
  var h='<div class="card"><div class="meta"><span>'+fmtT(g.tip)+'</span><span>'+st+'</span></div>';
  h+='<div class="row">'+sideBtn(g,"away",w,m,lk)+'<div class="at">@</div>'+sideBtn(g,"home",w,m,lk)+'</div>';
  if(lk&&who.length)h+='<div class="chips">'+who.map(function(u){
    var p=picks[u][g.id],c="chip"+(w?(p===w?" r":" w"):"");
    return '<span class="'+c+'">'+esc(u)+": "+(p==="away"?g.a:g.h)+'</span>'}).join("")+'</div>';
  return h+'</div>';
}
function renderGames(){
  var end=day+864e5,list=games.filter(function(g){return g.tip>=day&&g.tip<end}),td=startOfDay(Date.now());
  var lab=day===td?"Today · ":day===td+864e5?"Tomorrow · ":day===td-864e5?"Yesterday · ":"";
  var nav='<div class="nav"><button data-nav="-1">‹</button><div class="d">'+lab+new Date(day).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+
    '</div><button data-nav="0">Today</button><button data-nav="1">›</button></div>';
  if(!list.length){var nx=games.filter(function(g){return g.tip>=end})[0];
    return nav+'<div class="note">No games this day. '+(nx?'<br><br><button class="btn" data-nav="j" style="width:auto">Next game day</button>':'')+'</div>'}
  return nav+list.map(card).join("");
}
function renderBoard(){
  var rows=Object.keys(picks).map(function(u){
    var c=0,t=0;games.forEach(function(g){var p=picks[u][g.id];if(g.fin&&p){t++;if(p===winner(g))c++}});return{u:u,c:c,t:t}
  }).sort(function(a,b){return b.c-a.c||a.t-b.t});
  if(!rows.length)return '<div class="note">No tips yet.</div>';
  var medal=["🥇","🥈","🥉"];
  return '<div class="card">'+rows.map(function(r,i){
    return '<div class="lb'+(r.u===me?" me":"")+'"><span class="rk">'+(medal[i]||i+1)+'</span><span class="n">'+esc(r.u)+'</span><span style="color:var(--mute);font-size:12px">'+r.c+'/'+r.t+'</span><b>'+r.c+'</b></div>'}).join("")+'</div>';
}
function loginView(){
  var up=mode==="up";
  return '<div class="card login"><div class="logo">🏀</div><h2>NBA Tipping</h2><p style="color:var(--mute);margin:0 0 14px">'+(up?"Create your account":"Sign in to tip")+'</p>'+
    '<input id="lu" placeholder="Username" maxlength="20" autocapitalize="none" autocomplete="username">'+
    '<input id="lp" type="password" placeholder="Password (6+ characters)" autocomplete="'+(up?"new-password":"current-password")+'">'+
    '<button class="btn" id="lgo">'+(up?"Create account":"Sign in")+'</button><div class="err">'+esc(lerr)+'</div>'+
    '<button class="link" id="lsw">'+(up?"Have an account? Sign in":"New here? Create account")+'</button></div>';
}
function render(){
  var lu=document.getElementById("lu"),keepU=lu?lu.value:"";
  var login=AUTH&&!tok;
  document.getElementById("tabs").style.display=login?"none":"flex";
  document.getElementById("who").innerHTML=(AUTH&&tok)?esc(me)+' <button class="link" id="out">Log out</button>':"";
  document.getElementById("t1").className=tab===1?"on":"";
  document.getElementById("t2").className=tab===2?"on":"";
  if(login){top_.innerHTML="";app.innerHTML=loginView();var l2=document.getElementById("lu");if(l2)l2.value=keepU;return}
  var h="";
  if(!AUTH&&!me)h+='<div class="card"><div class="meta"><span>Pick a name (mates see this)</span></div><input id="nm" maxlength="24" placeholder="Your name"><button class="btn" id="go">Join</button></div>';
  if(err)h+='<div class="warn">'+esc(err)+'</div>';
  top_.innerHTML=h;
  app.innerHTML=tab===1?renderGames():renderBoard();
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="t1"){tab=1;render();loadSched().then(render)}
  else if(t.id==="t2"){tab=2;render();loadSched().then(render)}
  else if(t.id==="go"){var n=clean(document.getElementById("nm").value);if(n){me=n;localStorage.setItem("nba_name",me);render()}}
  else if(t.id==="lgo")doLogin();
  else if(t.id==="lsw"){mode=mode==="up"?"in":"up";lerr="";render()}
  else if(t.id==="out"){S=null;tok="";uid="";me="";picks={};localStorage.removeItem("nba_sess");render()}
  else if(t.dataset.g&&me&&!t.disabled)savePick(t.dataset.g,t.dataset.s);
  else if(t.dataset.nav==="j"){var nx=games.filter(function(g){return g.tip>=day+864e5})[0];if(nx){day=startOfDay(nx.tip);render();loadSched().then(render)}}
  else if(t.dataset.nav!==undefined){var v=+t.dataset.nav;day=v===0?startOfDay(Date.now()):startOfDay(day+v*864e5+(v>0?36e5:-36e5));render();loadSched().then(render)}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="lp")doLogin()});

async function start(){
  await Promise.all([loadSched(),loadPicks()]);
  if(!games.some(function(g){return g.tip>=day&&g.tip<day+864e5})){var n0=games.filter(function(g){return g.tip>=day})[0];if(n0){day=startOfDay(n0.tip);await loadSched()}}
  render();
  if(started)return;started=true;
  setInterval(async function(){if(AUTH&&!tok)return;await loadPicks();render()},30000);
  setInterval(async function(){if(AUTH&&!tok)return;await loadSched();render()},60000);
  if(AUTH)setInterval(refresh,45*60000);
}
(async function(){
  if(AUTH){if(S)await refresh();if(!tok){render();return}}
  await start();
})();
</script>
</body>
</html>
